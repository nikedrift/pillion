name: Generate shared debug keystore

# One-off: produces the stable debug keystore committed as ci/debug.keystore, so every CI build of
# this fork is signed with the same key and installs over the previous APK.

on:
  workflow_dispatch:

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Generate debug keystore
        run: |
          mkdir -p out
          keytool -genkeypair -v \
            -keystore out/debug.keystore \
            -storetype JKS -storepass android \
            -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          keytool -list -v -keystore out/debug.keystore -storepass android | grep -E 'SHA256:'

      - uses: actions/upload-artifact@v4
        with:
          name: debug-keystore
          path: out/debug.keystore
          if-no-files-found: error
